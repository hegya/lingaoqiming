<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>临高启明</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body {
			display: flex;
			height: 100vh;
			overflow: hidden;
			transition: background 0.3s ease;
		}
		/* 深色模式 */
		body.dark { background: #1a1a2e; }
		body.dark .sidebar { background: #16213e; border-color: #333; }
		body.dark .sidebar .vol-item { color: #e0e0e0; }
		body.dark .sidebar .chapter-item { color: #61afef; }
		body.dark .sidebar .vol-item:hover,
		body.dark .sidebar .chapter-item:hover { background: #2d3748; }
		body.dark .content { background: #1a1a2e; }
		body.dark .chapter-title { background: #16213e; border-color: #333; color: #e0e0e0; }
		body.dark .chapter-content { color: #e0e0e0; }
		body.dark .nav-btn { background: #4a5568; }
		body.dark .nav-btn:hover:not(:disabled) { background: #5a6578; }
		/* 遮罩层 */
		.mask {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0,0,0,0.3);
			z-index: 90;
		}
		/* 左侧目录栏 */
		.sidebar {
			width: 280px;
			background: #f6f8fa;
			border-right: 1px solid #e1e4e8;
			overflow-y: auto;
			padding: 16px;
			z-index: 95;
			transition: transform 0.3s ease;
		}
		/* 右侧内容区 */
		.content {
			flex: 1;
			padding: 24px;
			padding-top: 50px;
			overflow-y: auto;
			background: #fff;
			position: relative;
		}
		/* 固定置顶的章节标题 */
		.chapter-title {
			position: fixed;
			top: 0;
			left: 280px;
			right: 0;
			padding: 5px 6px;
			margin: 0;
			background: #fff;
			border-bottom: 1px solid #e1e4e8;
			z-index: 10;
			color: #24292e;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}
		/* 目录开关按钮 */
		.mobile-toggle {
			display: none;
			padding: 6px 10px;
			background: #0366d6;
			color: #fff;
			border: none;
			border-radius: 6px;
			cursor: pointer;
			font-size: 14px;
		}
		/* 主题切换按钮 */
		.theme-toggle {
			position: fixed;
			bottom: 20px;
			right: 20px;
			width: 44px;
			height: 44px;
			border-radius: 50%;
			border: none;
			cursor: pointer;
			z-index: 100;
			font-size: 20px;
			background: #0366d6;
			color: #fff;
			box-shadow: 0 2px 8px rgba(0,0,0,0.2);
			transition: transform 0.2s ease;
		}
		.theme-toggle:hover { transform: scale(1.1); }
		/* 目录样式 */
		.toc {
			list-style: none;
		}
		.vol-item {
			cursor: pointer;
			padding: 4px 8px;
			border-radius: 3px;
			font-weight: 500;
			margin: 2px 0;
		}
		.vol-item:hover {
			background: #e6ebf1;
		}
		.vol-item.expanded::before { content: "▼ "; font-size: 0.8em; }
		.vol-item.collapsed::before { content: "▶ "; font-size: 0.8em; }
		.chapters-list {
			list-style: none;
			margin: 4px 0 8px 20px;
			display: none;
		}
		.vol-item.expanded + .chapters-list { display: block; }
		.chapter-item {
			padding: 4px 6px;
			border-radius: 3px;
			cursor: pointer;
			color: #0366d6;
			margin: 2px 0;
		}
		.chapter-item:hover {
			background: #e6ebf1;
			text-decoration: none;
		}
		.chapter-item.active {
			background: #0366d6;
			color: #fff;
		}
		/* 章节内容样式 */
		.chapter-content {
			line-height: 1.8;
			font-size: 20px;
			white-space: pre-wrap;
			margin-top: 40px;
			margin-bottom: 10px;
			color: #24292e;
			padding: 4px 0;
		}
		.chapter-content p {
			text-indent: 2em;
			margin: 0 0 0.5em 0;
			line-height: 1.5;
		}
		/* 翻页按钮 */
		.nav-buttons {
			display: flex;
			gap: 16px;
			justify-content: space-between;
			margin-bottom: 30px;
			padding-bottom: 20px;
		}
		.nav-btn {
			padding: 8px 16px;
			background: #0366d6;
			color: #fff;
			border: none;
			border-radius: 6px;
			cursor: pointer;
			font-size: 14px;
			transition: background 0.2s ease;
		}
		.nav-btn:hover:not(:disabled) {
			background: #005cc5;
		}
		.nav-btn:disabled {
			background: #94a3b8;
			cursor: not-allowed;
		}
		/* 响应式适配 */
		@media (max-width: 1024px) {
			.sidebar {
				position: fixed;
				left: 0;
				top: 0;
				height: 100%;
				transform: translateX(-100%);
				-webkit-transform: translateX(-100%);
				width: 250px;
				max-width: 80%;
			}
			.mobile-toggle {
				display: block;
			}
			.chapter-title {
				left: 0;
			}
			.sidebar.show + .mask {
				display: block;
			}
			.sidebar.show {
				transform: translateX(0);
				-webkit-transform: translateX(0);
			}
			.content {
				padding: 16px;
				padding-top: 50px;
				width: 100%;
			}
			.chapter-content { font-size: 18px; }
			.theme-toggle {
				bottom: 70px;
			}
		}
	</style>
</head>
<body>
	<!-- 左侧目录栏 -->
	<div class="sidebar" id="sidebar">
		<ul class="toc" id="toc"></ul>
	</div>
	<!-- 移动端遮罩层 -->
	<div class="mask" id="mask"></div>
	<!-- 右侧内容区 -->
	<div class="content" id="content">
		<h3 class="chapter-title">
			<button class="mobile-toggle" id="mobileToggle">☰ 目录</button>
		</h3>
		<img src="./lgqm.webp">
	</div>
	<!-- 主题切换按钮 -->
	<button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>

	<script>
		let tocData = [];
		let allChapters = [];
		let currentPath = '';
		const chapterCache = new Map();

		async function init() {
			try {
				const res = await fetch('./toc.json');
				tocData = await res.json();
				tocData.sort((a, b) => {
					const numA = parseInt(a.name.replace('第', '').replace('卷', ''));
					const numB = parseInt(b.name.replace('第', '').replace('卷', ''));
					return numA - numB;
				});
				allChapters = tocData.flatMap(vol => 
					vol.chapters.map(chap => ({ ...chap, volName: vol.name }))
				);
				renderToc();
				initEventDelegation();
				restoreProgress();
				restoreTheme();
			} catch (err) {
				document.getElementById('content').innerHTML = `
					<h2 class="chapter-title">
						<button class="mobile-toggle" id="mobileToggle">☰ 目录</button>
					</h2>
					目录加载失败：${err.message}
				`;
			}
		}

		function renderToc() {
			const tocEl = document.getElementById('toc');
			tocData.forEach(vol => {
				const volEl = document.createElement('li');
				volEl.className = 'vol-item collapsed';
				volEl.textContent = vol.name;
				tocEl.appendChild(volEl);

				const chaptersEl = document.createElement('ul');
				chaptersEl.className = 'chapters-list';
				vol.chapters.forEach(chap => {
					const chapEl = document.createElement('li');
					chapEl.className = 'chapter-item';
					chapEl.textContent = chap.name;
					chapEl.dataset.path = chap.path;
					chaptersEl.appendChild(chapEl);
				});
				tocEl.appendChild(chaptersEl);
			});
		}

		function initEventDelegation() {
			// 目录点击展开/折叠
			document.getElementById('sidebar').addEventListener('click', (e) => {
				if (e.target.classList.contains('vol-item')) {
					const isExpanded = e.target.classList.contains('expanded');
					document.querySelectorAll('.vol-item.expanded').forEach(item => {
						item.classList.remove('expanded');
						item.classList.add('collapsed');
					});
					if (!isExpanded) {
						e.target.classList.remove('collapsed');
						e.target.classList.add('expanded');
					}
				} else if (e.target.classList.contains('chapter-item')) {
					const path = e.target.dataset.path;
					if (path) {
						loadChapter(path);
						if (window.innerWidth <= 1024) {
							document.getElementById('sidebar').classList.remove('show');
						}
					}
				}
			});

			// 移动端目录开关
			document.getElementById('mobileToggle').addEventListener('click', () => {
				document.getElementById('sidebar').classList.toggle('show');
			});
			document.getElementById('mask').addEventListener('click', () => {
				document.getElementById('sidebar').classList.remove('show');
			});

			// 主题切换
			document.getElementById('themeToggle').addEventListener('click', toggleTheme);

			// 键盘快捷键
			document.addEventListener('keydown', handleKeydown);
		}

		function handleKeydown(e) {
			const idx = allChapters.findIndex(chap => chap.path === currentPath);
			if (e.key === 'ArrowLeft' && idx > 0) {
				e.preventDefault();
				loadChapter(allChapters[idx - 1].path);
			} else if (e.key === 'ArrowRight' && idx >= 0 && idx < allChapters.length - 1) {
				e.preventDefault();
				loadChapter(allChapters[idx + 1].path);
			}
		}

		async function loadChapter(path) {
			currentPath = path;
			
			if (chapterCache.has(path)) {
				renderChapter(chapterCache.get(path), path);
				return;
			}

			try {
				const res = await fetch(path);
				if (!res.ok) throw new Error(`HTTP ${res.status}`);
				const content = await res.text();
				chapterCache.set(path, content);
				renderChapter(content, path);
			} catch (err) {
				const contentEl = document.getElementById('content');
				contentEl.innerHTML = `
					<h2 class="chapter-title">
						<button class="mobile-toggle" id="mobileToggle">☰ 目录</button>
					</h2>
					章节加载失败：${err.message}
				`;
				currentPath = '';
			}
		}

		function renderChapter(content, path) {
			const paragraphs = content.split('\n').filter(p => p.trim() !== '');
			const contentHtml = paragraphs.map(p => `<p>${p}</p>`).join('');
			const contentEl = document.getElementById('content');
			const currIdx = allChapters.findIndex(chap => chap.path === path);
			const prevChap = allChapters[currIdx - 1];
			const nextChap = allChapters[currIdx + 1];

			contentEl.innerHTML = `
				<h2 class="chapter-title">
					${allChapters[currIdx].volName}<br>${allChapters[currIdx].name}
					<button class="mobile-toggle" id="mobileToggle">☰ 目录</button>
				</h2>
				<div class="chapter-content">${contentHtml}</div>
				<div class="nav-buttons">
					<button class="nav-btn" ${!prevChap ? 'disabled' : ''}
						onclick="loadChapter('${prevChap?.path || ''}')">
						上一章
					</button>
					<button class="nav-btn" ${!nextChap ? 'disabled' : ''}
						onclick="loadChapter('${nextChap?.path || ''}')">
						下一章
					</button>
				</div>
			`;
			contentEl.scrollTop = 0;
			window.scrollTo(0, 0);
			saveProgress(path);
			updateActiveChapter(path);
		}

		function updateActiveChapter(path) {
			document.querySelectorAll('.chapter-item').forEach(el => {
				el.classList.remove('active');
				if (el.dataset.path === path) {
					el.classList.add('active');
				}
			});
		}

		function saveProgress(path) {
			localStorage.setItem('lgqm_current_chapter', path);
		}

		function restoreProgress() {
			const savedPath = localStorage.getItem('lgqm_current_chapter');
			if (savedPath && allChapters.some(chap => chap.path === savedPath)) {
				loadChapter(savedPath);
			}
		}

		function toggleTheme() {
			const isDark = document.body.classList.toggle('dark');
			localStorage.setItem('lgqm_theme', isDark ? 'dark' : 'light');
			document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
		}

		function restoreTheme() {
			if (localStorage.getItem('lgqm_theme') === 'dark') {
				document.body.classList.add('dark');
				document.getElementById('themeToggle').textContent = '☀️';
			}
		}

		init();
	</script>
</body>
</html>
